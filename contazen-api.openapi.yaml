            schema:
              type: object
              required:
                - amount
                - payment_date
              properties:
                amount:
                  type: number
                  description: Payment amount
                payment_date:
                  type: string
                  format: date
                  description: Payment date (defaults to today)
                payment_method:
                  type: string
                  description: Payment method used
                observations:
                  type: string
                  description: Payment notes
      responses:
