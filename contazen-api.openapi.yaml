  # Expenses endpoints
  /expenses:
    get:
      operationId: listExpenses
      tags: [Expenses]
      summary: List all expenses
      description: Retrieves a paginated list of expenses with optional filters
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Items per page
        - name: supplier_id
          in: query
          schema:
            type: string
          description: Filter by supplier CzUid
        - name: category_id
          in: query
          schema:
            type: integer
          description: Filter by category ID
        - name: status
          in: query
          schema:
            type: string
            enum: [paid, unpaid, overdue, registered]
          description: Filter by payment status
        - name: currency
          in: query
          schema:
            type: string
          description: Filter by currency code
        - name: payment_type
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 7
          description: |
            Filter by payment type:
            1 = Cash
            2 = Bank transfer
            3 = Card
            4 = Check
            5 = Promissory note
            6 = Other
            7 = Compensation
        - name: start_date
          in: query
          schema:
            type: string
            format: date
          description: Start date (YYYY-MM-DD)
        - name: end_date
          in: query
          schema:
            type: string
            format: date
          description: End date (YYYY-MM-DD)
        - name: min_amount
          in: query
          schema:
            type: number
          description: Minimum amount filter
        - name: max_amount
          in: query
          schema:
            type: number
          description: Maximum amount filter
        - name: search
          in: query
          schema:
            type: string
          description: Search in reference and description
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, date, due_date, amount]
            default: date
          description: Sort field
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort order
        - name: expand
          in: query
          schema:
            type: string
          description: "Comma-separated list of relations to expand. Supported: `supplier`, `category`, `user`."
      responses:
        '200':
          description: List of expenses
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ExpenseList'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
          
    post:
      operationId: createExpense
      tags: [Expenses]
      summary: Create an expense
      description: |
        Creates a new expense record with minimal required fields.
        
        ## Required Fields (only 4)
        - `supplier_id`: Supplier CzUid (required)
        - `amount`: Amount (required, positive number) 
        - `vat`: VAT percentage (required - accepts 0, 5, 9, 11, 19, 21)
        - `date`: Date in Y-m-d format (required)
        
        ## Optional Fields with Smart Defaults
        - `currency`: Currency code (defaults to RON)
        - `due_date`: Due date (defaults to 30 days from today)
        - `paid_date`: Payment date (defaults to today if is_paid=true)
        - `payment_type`: Payment type ID 1-7 (defaults to 1 if is_paid=true)
        - `category_id`: Category ID (defaults to 0)
        - `reference`: Reference number
        - `description`: Description
        - `with_vat`: Whether amount includes VAT (defaults to false)
        - `is_paid`: Whether expense is paid (defaults to false)
        - `with_currency_exchange`: Boolean for currency exchange
        - `currency_to`: Target currency (if with_currency_exchange)
        - `currency_rate`: Exchange rate (if with_currency_exchange)
        
        ## VAT Rates
        Supported VAT rates: 0%, 5%, 9%, 11%, 19%, 21% (21% is standard in Romania)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseCreateRequest'
      responses:
        '201':
          description: Expense created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Expense'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
          
