  /invoices/{id}/storno:
    post:
      operationId: stornoInvoice
      tags: [Invoices]
      summary: Storno (reverse) an invoice
      description: |
        Creates a reversal invoice with negated line amounts and links it to
        the source via `storno_bill_id`. Both invoices receive a history
        event (`TYPE_STORNO` on the source, `TYPE_STORNED` on the reversal).
        The whole operation runs inside a DB transaction.

        ## Preconditions
        - Source invoice must be fiscal (not a draft or proforma).
        - Source must not already be a storno (`is_storno = 0`).
        - Source must not already have been storno'd (`storno_bill_id` unset).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Source invoice CzUid
      responses:
        '200':
          description: Storno invoice created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Invoice'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          description: Invoice cannot be reversed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                cannot_be_storned:
                  value:
                    success: false
                    error:
                      type: invalid_request_error
                      code: invoice_cannot_be_storned
                      message: This invoice cannot be reversed. Only fiscal invoices can be reversed.
                already_storned:
                  value:
                    success: false
                    error:
                      type: invalid_request_error
                      code: invoice_already_storned
                      message: Invoice has already been reversed
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

