        - Full payment: Invoice is marked as paid
        - Partial payment: Invoice remains unpaid with updated balance
        - Already paid invoices cannot accept additional payments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Invoice CzUid
      requestBody:
        required: true
        content:
