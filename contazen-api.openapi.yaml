  /expenses/ocr-extract:
    post:
      operationId: ocrExtractReceipt
      tags: [Expenses]
      summary: Scan receipt (OCR)
      description: |
        Upload a Romanian receipt or supplier invoice photo and receive a
        structured prefill payload (supplier match, dates, totals, per-rate
        VAT breakdown, optional per-line items, payment-method hint).

        Use the response to prefill an expense form. Persist via
        POST /expenses — typically with `vat = "mix"` + `amount_vat_manual`
        for multi-rate receipts.

        See [the OCR endpoint guide](/api-reference/endpoints/expenses/ocr-extract).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: Receipt image (JPEG / PNG / WebP, ≤ 10 MB).
      responses:
        '200':
          description: Extracted prefill payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrReceiptPayload'
        '400':
          description: Invalid file (missing, wrong type, too large)
        '502':
          description: Extraction failed (transient — safe to retry)
        '503':
          description: OCR not enabled on this deployment

  /expenses/check-duplicate:
    post:
      operationId: checkExpenseDuplicate
      tags: [Expenses]
      summary: Pre-check for duplicate expense
      description: |
        Probe the firm's books for an existing expense that would collide
        with the prospective payload (same supplier + reference, or same
        supplier + date + amount within tolerance). Useful before posting a
        scanned receipt to surface a confirmation dialog.

        Returns `{ duplicate: null }` when nothing matches, or a payload
        describing the existing row otherwise. Match types:
        - `exact` — supplier + reference
        - `strong` — supplier + date + amount (±0.02)
        - `likely` — reference collision across suppliers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                supplier_id:
                  type: string
                  description: Supplier CzUid (preferred) or omit and send `supplier_data`.
                supplier_data:
                  type: object
                  properties:
                    name: { type: string }
                    cui:  { type: string }
                reference:
                  type: string
                date:
                  type: string
                  format: date
                amount:
                  type: number
                currency:
                  type: string
                  default: RON
      responses:
        '200':
          description: Duplicate check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  duplicate:
                    nullable: true
                    type: object
                    properties:
                      id:         { type: string }
                      reference:  { type: string, nullable: true }
                      date:       { type: string, format: date }
                      amount:     { type: number }
                      currency:   { type: string }
                      match_type: { type: string, enum: [exact, strong, likely] }

  /expenses/{id}/attachments:
    post:
      operationId: uploadExpenseAttachment
      tags: [Expenses]
      summary: Upload expense attachment
      description: |
        Upload a single PDF or image attachment for an expense. Each expense supports only ONE attachment (stored in the 'image' field).
        
        ## File Requirements
        - Supported types: PDF, JPG, JPEG, PNG
        - Maximum file size: 10MB
        - Only one attachment per expense
        
        ## Important Notes
        - Uploading a new file will replace any existing attachment
        - Creates a default supplier if the expense doesn't have one
        - There is NO GET endpoint for listing attachments (single attachment only)
        - There is NO DELETE endpoint for removing attachments individually
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Expense CzUid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF or image file (max 10MB)
      responses:
        '200':
          description: Attachment uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      filename:
                        type: string
                      url:
                        type: string
                      size:
                        type: integer
                      type:
                        type: string
                        enum: [pdf, image]
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          description: Invalid file or size limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /expenses/{id}/efactura-pdf:
