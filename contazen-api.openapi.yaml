              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
          
  # Supplier Bills endpoints (e-Factura received invoices)
  /supplier-bills:
    get:
      operationId: listSupplierBills
      tags: [Supplier Bills]
      summary: List supplier bills
      description: |
        Returns supplier invoices received from the ANAF SPV inbox (e-Factura).
        Mirrors the web view at /firm/bill-supplier with filters, totals and
        pagination. Spans every work point under the parent company.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: status
          in: query
          schema: { type: string, enum: [unpaid, paid, partial] }
        - name: supplier
          in: query
          description: Search by supplier name or VAT id (LIKE).
          schema: { type: string }
        - name: search
          in: query
          description: Alias of `supplier` — search by CIF or supplier name.
          schema: { type: string }
        - name: supplier_id
          in: query
          description: Filter by supplier CzUid.
          schema: { type: string }
        - name: currency
          in: query
          schema: { type: string }
        - name: invoice_type_code
          in: query
          schema: { type: string, enum: ['380', '381'] }
          description: 380 = invoice, 381 = credit note.
        - name: start_date
          in: query
          schema: { type: string, format: date }
        - name: end_date
          in: query
          schema: { type: string, format: date }
        - name: sort
          in: query
          schema:
            type: string
            enum: [issue_date, due_date, total, invoice_number, created_at]
            default: issue_date
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: expand
          in: query
          description: "Comma-separated list of relations to expand. Supported: `supplier`, `expense`, `client`, `efactura_message`, `lines`."
          schema: { type: string }
      responses:
        '200':
          description: List of supplier bills
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/SupplierBillList' }
                  meta: { $ref: '#/components/schemas/ResponseMeta' }
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /supplier-bills/sync:
    post:
      operationId: syncSupplierBills
      tags: [Supplier Bills]
      summary: Trigger SPV sync
      description: |
        Pulls fresh messages from the ANAF SPV inbox, downloads any missing
        XMLs, and imports received invoices into Contazen. Synchronous — the
        call blocks until ANAF responds (typically 5–30s per firm). Concurrent
        syncs for the same firm are rejected with HTTP 429.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                days:
                  type: integer
                  minimum: 1
                  maximum: 60
                  description: |
                    How far back to fetch (1–60). When omitted, the window is
                    chosen automatically based on the time since the last sync.
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/SupplierBillSyncResult' }
                  meta: { $ref: '#/components/schemas/ResponseMeta' }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          description: A sync for this firm is already in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: ANAF SPV call failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /supplier-bills/{id}:
    get:
      operationId: getSupplierBill
      tags: [Supplier Bills]
      summary: Get supplier bill
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Supplier bill CzUid.
        - name: expand
          in: query
          schema: { type: string }
          description: "Defaults to `supplier,expense,client,efactura_message,lines`."
      responses:
        '200':
          description: Supplier bill detail (with `supplier_balance` block)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      supplier_bill:
                        allOf:
                          - $ref: '#/components/schemas/SupplierBill'
                          - type: object
                            properties:
                              supplier_balance:
                                $ref: '#/components/schemas/SupplierBillBalance'
                  meta: { $ref: '#/components/schemas/ResponseMeta' }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Bill not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      operationId: deleteSupplierBill
      tags: [Supplier Bills]
      summary: Delete supplier bill (soft delete)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Bill marked as deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      object: { type: string, example: supplier_bill }
                      deleted: { type: boolean }
                  meta: { $ref: '#/components/schemas/ResponseMeta' }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Bill not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /supplier-bills/{id}/mark-paid:
    post:
      operationId: markSupplierBillPaid
      tags: [Supplier Bills]
      summary: Mark supplier bill as paid
      description: |
        Records a payment on the supplier bill. Pass `payment_amount` lower
        than the bill total to record a partial payment — the resulting status
        becomes `partial`. Linked expenses are kept in sync.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierBillMarkPaidRequest'
      responses:
        '200':
          description: Bill updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      supplier_bill: { $ref: '#/components/schemas/SupplierBill' }
                      message: { type: string }
                  meta: { $ref: '#/components/schemas/ResponseMeta' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Bill not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /supplier-bills/{id}/mark-unpaid:
    post:
      operationId: markSupplierBillUnpaid
      tags: [Supplier Bills]
      summary: Mark supplier bill as unpaid
      description: Clears `payment_date`, `payment_amount`, and resets `status` to `unpaid`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Bill updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      supplier_bill: { $ref: '#/components/schemas/SupplierBill' }
                      message: { type: string }
                  meta: { $ref: '#/components/schemas/ResponseMeta' }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Bill not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /supplier-bills/{id}/efactura-pdf:
    get:
      operationId: getSupplierBillEfacturaPdf
      tags: [Supplier Bills]
      summary: Download e-Factura PDF
      description: |
        Streams the ANAF e-Factura PDF for this bill. Generated on demand via
        the ANAF public validator the first time it is requested, then cached
        on disk. Returns 404 when the bill has no associated SPV message.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: PDF stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Bill not found or no e-Factura XML available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: ANAF PDF generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Settings endpoint
  /settings:
    get:
      operationId: getSettings
      tags: [Settings]
      summary: Get API settings
      description: |
        Get current API settings, configuration, and account information.

        This endpoint provides comprehensive information about:
        - API version and rate limits
        - Firm details and configuration
        - Invoice series and numbering
        - E-Factura setup status
        - Available features and subscription
        - Supported currencies and VAT rates
      responses:
        '200':
          description: API settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Settings'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /payments:
    get:
      operationId: listPayments
      tags: [Payments]
      summary: List payments
      description: |
        List all payments across invoices for the authenticated firm.
        Returns a flattened view of invoice payments with invoice and client references.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: invoice_id
          in: query
          description: Filter by invoice ID (CzUid)
          schema:
            type: string
        - name: client_id
          in: query
          description: Filter by client ID (CzUid)
          schema:
            type: string
        - name: type
          in: query
          description: Filter by payment type
          schema:
            type: string
            enum: [receipt, bank_order, card, cheque, promissory_note, other, fiscal_receipt]
        - name: date_from
          in: query
          description: Filter from date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          description: Filter to date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: sort
          in: query
          schema:
            type: string
            enum: [date, amount, created_at]
            default: date
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: List of payments
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      object:
                        type: string
                        example: list
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Payment'
                      has_more:
                        type: boolean
                      total:
                        type: integer
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      totals:
                        $ref: '#/components/schemas/PaymentTotals'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /payments/{id}:
    get:
      operationId: getPayment
      tags: [Payments]
      summary: Retrieve a payment
      description: Get details of a specific payment by its ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Payment'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /receipts:
    get:
      operationId: listReceipts
      tags: [Receipts]
      summary: List receipts
      description: |
        List `chitanță` (cash receipt) documents for the authenticated firm.
        Each row may be standalone or paired with an invoice and a
        `FirmBillPayment` (see `payment` on `GET /receipts/{id}`).
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: date_from
          in: query
          description: Filter from date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          description: Filter to date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: client_id
          in: query
          description: Filter by client CzUid (matches all snapshots of that client)
          schema:
            type: string
        - name: invoice_id
          in: query
          description: Only chitanțe paying this invoice (CzUid)
          schema:
            type: string
        - name: include_deleted
          in: query
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          schema:
            type: string
            enum: [date, amount, created_at]
            default: date
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: List of receipts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      object:
                        type: string
                        example: list
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Receipt'
                      has_more:
                        type: boolean
                      total:
                        type: integer
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      operationId: createReceipt
      tags: [Receipts]
      summary: Create a receipt
      description: |
        Create a chitanță. When `invoice_id` is supplied, a paired
        `FirmBillPayment` is created and the invoice's paid state is
        recomputed (flips to `is_paid: true` once the cumulative paid amount
        meets the invoice total). Standalone chitanțe (no invoice) skip the
        payment row and default to type `receipt` (numerar).

        Cash-register synchronization runs inside the same transaction —
        failures roll the whole save back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptCreateRequest'
      responses:
        '201':
          description: Receipt created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Receipt'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          $ref: '#/components/responses/ValidationError'
        '422':
          description: |
            Returned when the firm has no chitanță series configured
            (`code: chitanta_series_missing`) or `validate()` rejects the
            payload (`code: validation_failed`).
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /receipts/{id}:
    get:
      operationId: getReceipt
      tags: [Receipts]
      summary: Retrieve a receipt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Receipt CzUid
      responses:
        '200':
          description: Receipt details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Receipt'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    put:
      operationId: updateReceipt
      tags: [Receipts]
      summary: Update a receipt
      description: |
        Updates an existing chitanță. Returns `409 resource_deleted` if the
        receipt has already been soft-deleted. Linked invoice paid state is
        re-computed when amount/invoice changes.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptUpdateRequest'
      responses:
        '200':
          description: Receipt updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Receipt'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: "Receipt already deleted (`code: resource_deleted`)"
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    delete:
      operationId: deleteReceipt
      tags: [Receipts]
      summary: Delete a receipt
      description: |
        Soft-deletes the chitanță. Cascades to the linked
        `FirmBillPayment` (if any) and undoes the invoice's paid state.
        Idempotent — re-deleting an already-deleted receipt returns success.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Receipt deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      object:
                        type: string
                        example: receipt
                      deleted:
                        type: boolean
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /company-lookup:
    get:
      operationId: companyLookup
      tags: [Company Lookup]
      summary: Look up a Romanian company by CUI/CIF
      description: |
        Query Romanian company registry data by CUI/CIF number. Returns company name,
        registration details, address, VAT status, and e-invoice registration status.

        The lookup is rate-limited to 1 request per second due to upstream ANAF constraints.
      parameters:
        - name: cui
          in: query
          required: true
          description: The CUI/CIF number to look up (with or without RO prefix)
          schema:
            type: string
            example: "12345678"
      responses:
        '200':
          description: Company data found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      object:
                        type: string
                        example: company_lookup
                      cui:
                        type: string
                      name:
                        type: string
                      rc:
                        type: string
                        description: Trade registry number (Registrul Comerțului)
                      address:
                        type: string
                      city:
                        type: string
                      county:
                        type: string
                      country:
                        type: string
                      postal_code:
                        type: string
                      caen:
                        type: string
                        description: CAEN activity code
                      vat_payer:
                        type: boolean
                      split_vat:
                        type: boolean
                      ro_einvoice_registered:
                        type: boolean
                        description: Whether registered for Romanian e-invoice system
                      is_inactive:
                        type: boolean
                      registration_date:
                        type: string
                      authority_name:
                        type: string
                      source:
                        type: string
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '404':
          description: No company found for the given CUI
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '503':
          description: Lookup service temporarily unavailable

  /invoice-series:
    get:
      operationId: listInvoiceSeries
      tags: [Invoice Series]
      summary: List invoice series
      description: List all invoice numbering series for the authenticated firm.
      parameters:
        - name: document_type
          in: query
          description: Filter by document type
          schema:
            type: string
            enum: [fiscal, proforma]
      responses:
        '200':
          description: List of invoice series
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      object:
                        type: string
                        example: list
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/InvoiceSeries'
                      total:
                        type: integer
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      operationId: createInvoiceSeries
      tags: [Invoice Series]
      summary: Create an invoice series
      description: Create a new invoice numbering series.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, document_type]
              properties:
                name:
                  type: string
                  description: Series prefix/name (e.g., "FACT", "PF")
                  example: FACT
                document_type:
                  type: string
                  enum: [fiscal, proforma]
                description:
                  type: string
                start_number:
                  type: integer
                  default: 1
                  description: First invoice number in the series
                is_primary:
                  type: boolean
                  default: false
                  description: Set as the default series for this document type
      responses:
        '201':
          description: Series created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/InvoiceSeries'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '409':
          description: Series with this name/type already exists
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /invoice-series/{id}:
    put:
      operationId: updateInvoiceSeries
      tags: [Invoice Series]
      summary: Update an invoice series
      description: |
        Update an invoice series. Only series that have not been used for any documents can be modified.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
      responses:
        '200':
          description: Series updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/InvoiceSeries'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          description: Series is already in use and cannot be modified
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /invoice-series/{id}/set-primary:
    post:
      operationId: setInvoiceSeriesPrimary
      tags: [Invoice Series]
      summary: Set series as primary
      description: Set an invoice series as the default for its document type. The previous primary series will be demoted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Series set as primary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/InvoiceSeries'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /invoice-series/{id}/lock:
    post:
      operationId: lockInvoiceSeries
      tags: [Invoice Series]
      summary: Lock series to mobile device
      description: |
        Bind the series to the calling mobile device so only that device can
        issue invoices against it. Requires a mobile JWT session whose backing
        `user_session` has a non-empty `device_id`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Series locked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/InvoiceSeries'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Series is already locked to another device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /invoice-series/{id}/unlock:
    post:
      operationId: unlockInvoiceSeries
      tags: [Invoice Series]
      summary: Unlock series
      description: |
        Release the mobile-device lock. The owning device can always unlock;
        other callers must pass `force: true` and have admin rights.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  default: false
                  description: Override the same-device rule when unlocking from another device.
      responses:
        '200':
          description: Series unlocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/InvoiceSeries'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Locked to another device and `force` not supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /invoice-series/{id}/reserve-numbers:
    post:
      operationId: reserveInvoiceSeriesNumbers
      tags: [Invoice Series]
      summary: Pre-allocate numbers for offline emission
      description: |
        Returns `count` reservation tokens. Each token corresponds to a
        pre-allocated invoice number on the series. The mobile device uses
        the tokens to emit invoices while offline — passing
        `reservation_token` to `POST /invoices` consumes the reservation and
        assigns its pre-allocated number instead of calling `nextNumber()`.

        Requires the series to already be locked to the calling device.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                count:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 10
      responses:
        '201':
          description: Reservations created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      object:
                        type: string
                        example: list
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/NumberReservation'
                      total:
                        type: integer
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: Series is not locked to this device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /invoice-series/{id}/reservations:
    get:
      operationId: listInvoiceSeriesReservations
      tags: [Invoice Series]
      summary: List pending reservations for this device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reservation list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      object:
                        type: string
                        example: list
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/NumberReservation'
                      total:
                        type: integer
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /invoice-series/reservations/{token}/release:
    post:
      operationId: releaseInvoiceSeriesReservation
      tags: [Invoice Series]
      summary: Release an unused reservation
      description: |
        Flip a pending reservation to `released`. The pre-allocated number is
        not returned to the pool — it becomes a documented gap.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reservation released
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/NumberReservation'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Reservation belongs to another device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /bank-accounts:
    get:
      operationId: listBankAccounts
      tags: [Bank Accounts]
      summary: List bank accounts
      description: List all IBAN bank accounts for the authenticated firm.
      parameters:
        - name: currency
          in: query
          description: Filter by currency
          schema:
            type: string
            example: RON
        - name: is_visible
          in: query
          description: Filter by visibility on invoices
          schema:
            type: boolean
      responses:
        '200':
          description: List of bank accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      object:
                        type: string
                        example: list
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BankAccount'
                      total:
                        type: integer
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      operationId: createBankAccount
      tags: [Bank Accounts]
      summary: Create a bank account
      description: Add a new IBAN bank account. The IBAN is validated and bank name/BIC are auto-detected for Romanian banks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [iban, bank_name, currency]
              properties:
                iban:
                  type: string
                  description: Valid IBAN number
                  example: RO49AAAA1B31007593840000
                bank_name:
                  type: string
                  example: Banca Transilvania
                currency:
                  type: string
                  example: RON
                swift:
                  type: string
                  description: SWIFT/BIC code (optional, auto-detected for Romanian banks)
                is_visible:
                  type: boolean
                  default: true
                  description: Whether to show this account on invoices
      responses:
        '201':
          description: Bank account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/BankAccount'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '409':
          description: IBAN already registered for this firm
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /bank-accounts/{id}:
    put:
      operationId: updateBankAccount
      tags: [Bank Accounts]
      summary: Update a bank account
      description: Update bank account details. IBAN uniqueness is validated.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                iban:
                  type: string
                bank_name:
                  type: string
                currency:
                  type: string
                swift:
                  type: string
                is_visible:
                  type: boolean
      responses:
        '200':
          description: Bank account updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/BankAccount'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    delete:
      operationId: deleteBankAccount
      tags: [Bank Accounts]
      summary: Delete a bank account
      description: Permanently delete a bank account.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bank account deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      object:
                        type: string
                        example: bank_account
                      deleted:
                        type: boolean
                        example: true
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /efactura/status:
    get:
      operationId: getEfacturaStatus
      tags: [E-Factura]
      summary: Get e-Factura status
      description: |
        Get the current e-Factura configuration status including OAuth connection,
        token validity, environment settings, and auto-send configuration.

        This is a read-only endpoint. To configure e-Factura OAuth, use the web interface at contazen.ro.
      responses:
        '200':
          description: E-Factura status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      object:
                        type: string
                        example: efactura_status
                      enabled:
                        type: boolean
                      oauth_configured:
                        type: boolean
                      token_valid:
                        type: boolean
                      token_expires_at:
                        type: string
                        format: date-time
                        nullable: true
                      environment:
                        type: string
                        enum: [test, live]
                      environments:
                        type: object
                        properties:
                          test:
                            type: object
                            properties:
                              configured:
                                type: boolean
                              token_expires_at:
                                type: string
                                nullable: true
                          live:
                            type: object
                            properties:
                              configured:
                                type: boolean
                              token_expires_at:
                                type: string
                                nullable: true
                      auto_send:
                        type: boolean
                      auto_send_timing:
                        type: string
                        enum: [immediate, delayed]
                        nullable: true
                      auto_send_delay_days:
                        type: integer
                        nullable: true
                      send_to_public_institutions:
                        type: boolean
                      configure_url:
                        type: string
                        description: URL to configure e-Factura on the web interface
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /invoices/{id}/history:
    get:
      operationId: getInvoiceHistory
      tags: [Invoices]
      summary: Invoice change history
      description: Audit trail for a fiscal invoice — creation, updates, payments, voids, etc.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Invoice ID (czUid).
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: History entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      object: { type: string, example: list }
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            type: { type: string, description: Internal event type }
                            type_label: { type: string, description: Human-readable label }
                            message: { type: string }
                            icon: { type: string, nullable: true }
                            by: { type: string, nullable: true, description: User who triggered the event }
                            created_at: { type: string, format: date-time }
                      pagination:
                        type: object
                        properties:
                          page: { type: integer }
                          per_page: { type: integer }
                          total: { type: integer }
                          total_pages: { type: integer }
                  meta: { $ref: '#/components/schemas/ResponseMeta' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /invoices/{id}/payment-estimate:
    get:
      operationId: getInvoicePaymentEstimate
      tags: [Invoices]
      summary: Predict invoice payment date
      description: |
        Returns a predicted payment date for an unpaid invoice using the client's
        historical average days-to-pay (falls back to firm average, then to
        `due_at + 7 days`). For already-paid invoices, returns the actual payment date.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Invoice ID (czUid).
      responses:
        '200':
          description: Payment estimate
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [unpaid, paid]
                      estimated_at:
                        type: string
                        format: date
                        nullable: true
                      due_at:
                        type: string
                        format: date
                        nullable: true
                      days_from_now:
                        type: integer
                        description: Days between today and estimated_at (negative if past).
                      days_overdue:
                        type: integer
                        description: Days the invoice is already overdue (0 if not overdue).
                      confidence:
                        type: string
                        enum: [low, medium, high, actual]
                      basis:
                        type: object
                        description: Data used to compute the estimate.
                        properties:
                          source:
                            type: string
                            enum: [client_history, firm_history, due_date_fallback, actual_payment]
                          sample_size: { type: integer, nullable: true }
                          avg_days_to_pay: { type: number, nullable: true }
                          client_on_time_pct: { type: number, nullable: true }
                  meta: { $ref: '#/components/schemas/ResponseMeta' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /vat-rates:
    get:
      operationId: listVatRates
      tags: [VAT Rates]
      summary: List firm VAT rates
      description: |
        Returns the firm's custom `firm_vat` rows plus the full catalog of
        Romanian rates (`available`) the firm can enable, adjusted for the
        firm's VAT-payer type and the 2025-08-01 rate rules.
      responses:
        '200':
          description: VAT rates list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  object: { type: string, enum: [list] }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/VatRate' }
                  total: { type: integer }
                  available:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: integer }
                        percent: { type: number }
                        description: { type: string }
                        ubl_category: { type: string }
                        reason: { type: string }
                  default_percent: { type: number }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
    post:
      operationId: createVatRate
      tags: [VAT Rates]
      summary: Add a firm-scoped VAT rate
      description: |
        Creates (or returns the existing) `firm_vat` row for the given
        percent. A standard description from the Romanian catalog is applied
        when `description` is omitted. Non-VAT-payer firms receive
        `400 non_vat_payer`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [percent]
              properties:
                percent:
                  type: integer
                  minimum: 0
                  maximum: 100
                description:
                  type: string
      responses:
        '200':
          description: Rate returned (created or already present)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  object: { type: string, enum: [vat_rate] }
                  data: { $ref: '#/components/schemas/VatRate' }
                  created:
                    type: boolean
                    description: false when an equivalent rate already existed
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /vat-rates/{id}:
    put:
      operationId: updateVatRate
      tags: [VAT Rates]
      summary: Update a VAT rate description
      description: Only `description` is mutable. `percent` is immutable because changing it would invalidate every bill line that references the rate.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: VAT rate CzUid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string }
      responses:
        '200':
          description: Rate updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  object: { type: string, enum: [vat_rate] }
                  data: { $ref: '#/components/schemas/VatRate' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      operationId: deleteVatRate
      tags: [VAT Rates]
      summary: Delete a firm VAT rate
      description: Fails with `409 in_use` if the rate is still referenced by any bill or notice row.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Rate deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  object: { type: string, enum: [vat_rate] }
                  deleted: { type: boolean }
        '409':
          description: Rate in use
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /currencies:
    get:
      operationId: listCurrencies
      tags: [Currencies]
      summary: List firm currencies
      description: Returns the firm's enabled currencies plus the `available` catalog of ISO-4217 codes Contazen supports.
      responses:
        '200':
          description: Currency list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  object: { type: string, enum: [list] }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Currency' }
                  total: { type: integer }
                  available:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, example: EUR }
                        description: { type: string }
                  default_code: { type: string, example: RON }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
    post:
      operationId: createCurrency
      tags: [Currencies]
      summary: Enable a currency for the firm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  example: EUR
                  description: ISO-4217 three-letter code (uppercased server-side).
      responses:
        '200':
          description: Currency enabled or already present
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  object: { type: string, enum: [currency] }
                  data: { $ref: '#/components/schemas/Currency' }
                  created: { type: boolean }
        '400':
          description: Invalid or unsupported currency
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /currencies/{id}:
    delete:
      operationId: deleteCurrency
      tags: [Currencies]
      summary: Disable a currency
      description: Fails with `409 in_use` if any bill or client still references the currency.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Currency CzUid
      responses:
        '200':
          description: Currency removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  object: { type: string, enum: [currency] }
                  deleted: { type: boolean }
        '409':
          description: Currency in use
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /languages:
    get:
      operationId: listLanguages
      tags: [Languages]
      summary: List firm languages
      description: Returns the firm's enabled bill-template languages plus the `available` catalog of supported codes. Romanian (`ro`) is always enabled and cannot be removed.
      responses:
        '200':
          description: Language list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  object: { type: string, enum: [list] }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Language' }
                  total: { type: integer }
                  available:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, example: en }
                        description: { type: string }
                  default_code: { type: string, example: ro }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
    post:
      operationId: createLanguage
      tags: [Languages]
      summary: Enable a language for the firm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  example: en
                  description: Two-letter lowercase ISO-639-1 code.
      responses:
        '200':
          description: Language enabled or already present
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  object: { type: string, enum: [language] }
                  data: { $ref: '#/components/schemas/Language' }
                  created: { type: boolean }
        '400':
          description: Invalid or unsupported language
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /languages/{id}:
    delete:
      operationId: deleteLanguage
      tags: [Languages]
      summary: Disable a language
      description: Fails with `409 is_default` when removing `ro`, which is the hard-coded default.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Language CzUid
      responses:
        '200':
          description: Language removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  object: { type: string, enum: [language] }
                  deleted: { type: boolean }
        '409':
          description: Default language cannot be removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
